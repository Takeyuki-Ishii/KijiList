<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head th:replace="~{layout/base :: header('一覧管理')}"></head>
<body class="bg-light">

    <nav th:replace="~{layout/base :: nav}"></nav>

<!-- ※既存の mt-5（マージントップ5）は、ナビゲーションバーとの間隔が開きすぎるため mt-2 などに縮めると綺麗です -->
    <div class="container mt-2" style="max-width: 600px;">
    <h1 class="text-center mb-4 text-primary">一覧管理</h1>

    <!-- 入力フォームカードの部分を以下のように差し替えます -->
    <div class="card p-4 shadow-sm mb-4">
        <!-- ★ th:object="${task}" を追加してコントローラーのモデルと紐付け -->
        <form th:action="@{/add-task(page=${currentPage}, keyword=${currentKeyword}, filter=${currentStatus}, sort=${currentSortType})}" th:object="${task}" method="post" novalidate>

            <!-- タイトルの入力欄 -->
            <div class="mb-3">
                <label class="form-label fw-bold">新規タイトル</label>
                <label>
                    <input type="text" th:field="*{name}"
                           maxlength="50"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                           class="form-control" placeholder="例：風景写真の記事">
                </label>
                <!-- ★ エラーメッセージ表示エリア -->
                <div th:if="${#fields.hasErrors('name')}"
                     th:errors="*{name}"
                     class="text-danger" style="font-size: 0.875rem; margin-top: 0.25rem;">
                    タスク名のエラーメッセージ
                </div>
            </div>

            <!-- 優先度（重要度）プルダウン項目 -->
            <div class="mb-3">
                <label class="form-label fw-bold">重要度</label>
                <label>
                    <select th:field="*{priority}" class="form-select">
                        <option value="低">低</option>
                        <option value="中" selected>中</option> <!-- 初期選択を"中"にする -->
                        <option value="高">高</option>
                    </select>
                </label>
            </div>
            <!-- 期限の入力欄 -->
            <div class="mb-3">
                <label class="form-label fw-bold">期限</label>
                <!-- ★ name="deadline" から th:field="*{deadline}" に変更 -->
                <input type="date" th:field="*{deadline}"
                       th:classappend="${#fields.hasErrors('deadline')} ? 'is-invalid' : ''"
                       class="form-control">
                <!-- ★ エラーメッセージ表示エリア -->
                <div class="invalid-feedback" th:if="${#fields.hasErrors('deadline')}" th:errors="*{deadline}">
                    期限のエラーメッセージ
                </div>
            </div>
            <!-- メモ（詳細説明）の入力欄 -->
            <div class="mb-3">
                <label class="form-label fw-bold">メモ（詳細説明）</label>
                <!-- 複数行入力のため textarea を使用。rows="3" で初期の縦幅を指定 -->
                <textarea th:field="*{memo}"
                          th:classappend="${#fields.hasErrors('memo')} ? 'is-invalid' : ''"
                          class="form-control" rows="3" placeholder="例：特売のものを2パック。無脂肪乳でも可。"></textarea>
                <!-- バリデーションエラー時のメッセージ表示エリア -->
                <div class="invalid-feedback" th:if="${#fields.hasErrors('memo')}" th:errors="*{memo}">
                    メモのエラーメッセージ
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-4">新規追加する</button>
        </form>
        <!-- 「タスクを追加する」ボタンの修正（mb-4 を追加） -->
        <!-- 検索フォームの修正（btn-secondary に変更） -->
        <form th:action="@{/tasks}" method="get" class="row g-2 mb-3">
            <!-- （hiddenタグ等はそのまま） -->
            <input type="hidden" name="filter" th:value="${currentFilter}">
            <input type="hidden" name="sort" th:value="${currentSort}">

            <div class="col-auto">
                <input type="text" name="keyword" th:value="${currentKeyword}" class="form-control" placeholder="キーワード検索...">
            </div>
            <div class="col-auto">
                <!-- 色を btn-secondary (グレー) に変更 -->
                <button type="submit" class="btn btn-secondary">検索</button>
                <!-- 検索クリアボタン（キーワードだけを消して現在のソート・フィルターは維持） -->
                <a th:href="@{/tasks(filter=${currentFilter}, sort=${currentSort})}"
                   class="btn btn-outline-secondary" th:if="${currentKeyword != null && !currentKeyword.isEmpty()}">クリア</a>
            </div>
        </form>
    </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="text-secondary">一覧</h2>
            <!-- 💡 ソート切り替えボタンエリア -->
            <div class="btn-group" role="group" aria-label="Sort options">
                <!-- 期限順ボタン -->
                <a th:href="@{/tasks(sort='deadline', filter=${currentStatus}, keyword=${currentKeyword})}"
                   th:classappend="${currentSort == 'deadline'} ? 'btn-success' : 'btn-outline-success'"
                   class="btn fw-bold btn-outline-primary">📅 期限が近い順</a>

                <!-- 重要度順ボタン -->
                <a th:href="@{/tasks(filter=${currentStatus}, sort='priority', keyword=${currentKeyword})}"
                   th:classappend="${currentSort == 'priority'} ? 'active' : ''"
                   class="btn btn-outline-dark btn-sm">🔥 重要度順</a>
            </div>
        </div>
        <nav th:if="${taskPage.totalPages > 1}" aria-label="Page navigation">
            <ul class="pagination justify-content-center">

                <!-- 「前へ」ボタン（最初のページでは無効化） -->
                <li class="page-item" th:classappend="${taskPage.first} ? 'disabled'">
                    <a class="page-item page-link"
                       th:href="@{/tasks(page=${taskPage.number - 1}, status=${currentStatus}, keyword=${currentKeyword}, sortType=${currentSortType})}">
                        前へ
                    </a>
                </li>

                <!-- ページ番号ボタン（0から始まるため +1 して表示） -->
                <li class="page-item"
                    th:each="i : ${#numbers.sequence(0, taskPage.totalPages - 1)}"
                    th:classappend="${i == taskPage.number} ? 'active'">
                    <a class="page-link"
                       th:href="@{/tasks(page=${i}, status=${currentStatus}, keyword=${currentKeyword}, sortType=${currentSortType})}"
                       th:text="${i + 1}">1</a>
                </li>

                <!-- 「次へ」ボタン（最後のページでは無効化） -->
                <li class="page-item" th:classappend="${taskPage.last} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/tasks(page=${taskPage.number + 1}, status=${currentStatus}, keyword=${currentKeyword}, sortType=${currentSortType})}">
                        次へ
                    </a>
                </li>

            </ul>
        </nav>
        <div class="mb-3">
            <div class="btn-group" role="group" aria-label="Filter options">
                <!-- すべてボタン -->
                <a th:href="@{/tasks(filter='all', sort=${currentSortType}, keyword=${currentKeyword})}"
                   th:classappend="${currentFilter == 'all'} ? 'btn-primary' : 'btn-outline-primary'"
                   class="btn btn-sm fw-bold">全て</a>

                <!-- 未完了のみボタン -->
                <a th:href="@{/tasks(filter='uncompleted', sort=${currentSortType}, keyword=${currentKeyword})}"
                   th:classappend="${currentFilter == 'uncompleted'} ? 'active' : ''" class="btn btn-outline-dark btn-sm">
                    未完了のみ</a>

                <!-- 完了ボタン -->
                <a th:href="@{/tasks(filter='completed', sort=${currentSortType}, keyword=${currentKeyword})}"
                   th:classappend="${currentFilter == 'completed'} ? 'btn-primary' : 'btn-outline-primary'"
                   class="btn btn-sm fw-bold">完了済み</a>
            </div>
        </div>
        <form th:action="@{/tasks/bulk-delete}" method="post" id="bulkDeleteForm" th:unless="${taskList.isEmpty()}">
            <!-- パラメータ維持（変数名は現在のコントローラーのモデル属性名に合わせて調整してください） -->
            <input type="hidden" name="page" th:value="${currentPage}">
            <input type="hidden" name="keyword" th:value="${currentKeyword}">
            <input type="hidden" name="filter" th:value="${currentStatus}">
            <input type="hidden" name="sort" th:value="${currentSortType}">
            <!-- もしページネーションの変数（currentPageなど）があればここに追加してください -->

            <!-- 2. 「全選択チェックボックス」と「一括削除ボタン」の配置 -->
            <div class="d-flex align-items-center mb-3 bg-light p-2 rounded border">
                <div class="form-check ms-2">
                    <input class="form-check-input" type="checkbox" id="selectAll">
                    <label class="form-check-label small text-muted" for="selectAll">すべて選択</label>
                </div>
                <button type="submit" class="btn btn-sm btn-danger ms-auto" id="bulkDeleteBtn" disabled onclick="return confirm('選択したタスクをすべて削除しますか？')">
                    選択したタスクを一括削除
                </button>
            </div>
        </form>
        <!-- ✨【追加】タスクが0件のときに表示するメッセージエリア -->
        <!-- th:if="${taskList.isEmpty()}" を指定（タスクが空の時だけ表示） -->
        <div th:if="${taskList.isEmpty()}" class="alert alert-info text-center py-4 shadow-sm" role="alert">
            <i class="bi bi-info-circle me-2"></i>該当するタスクはありません。
        </div>

        <!-- 3. 既存のリストグループ（チェックボックスを追加） -->
        <ul class="list-group shadow-sm" th:unless="${taskList.isEmpty()}">
            <li th:each="task : ${taskList}" class="list-group-item d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <!-- 個別チェックボックス -->
                    <label>
                        <input class="form-check-input me-3 task-checkbox" type="checkbox" name="taskIds" th:value="${task.id}" form="bulkDeleteForm">
                    </label>

                    <!-- 修正：中の要素を縦並び(d-flex flex-column)にして2段目をレイアウトできるようにする -->
                    <div class="d-flex flex-column">
                        <!-- 1段目：タスク名と各種バッジ -->
                        <div class="d-flex align-items-center flex-wrap">
                            <!-- タスク名の文字色制御 -->
                            <span class="fw-bold"
                                  th:text="${task.name}"
                                  th:classappend="${task.completed} ? 'text-decoration-line-through text-muted' : (
                              ${task.overdue} ? 'text-danger fst-italic fw-bolder' : (
                              ${task.deadline == T(java.time.LocalDate).now()} ? 'text-danger fw-bolder' : (
                              ${task.deadline.isAfter(T(java.time.LocalDate).now()) && (task.deadline.isBefore(T(java.time.LocalDate).now().plusDays(4)))} ? 'text-warning' : '')))">
                        タスク名
                    </span>

                            <!-- 期限切れ専用バッジ -->
                            <span th:if="${task.overdue}" class="badge bg-danger ms-2">期限切れ</span>

                            <!-- バッジの色制御 -->
                            <span class="badge ms-2"
                                  th:text="${task.deadline}"
                                  th:classappend="${task.overdue} ? 'bg-danger' : (
                              ${task.deadline == T(java.time.LocalDate).now()} ? 'bg-danger' : (
                              ${task.deadline.isAfter(T(java.time.LocalDate).now()) && (task.deadline.isBefore(T(java.time.LocalDate).now().plusDays(4)))} ? 'bg-warning text-dark' : 'bg-secondary'))">
                        2026-01-01
                    </span>
                            <span class="badge ms-1"
                                  th:text="${task.priority}"
                                  th:classappend="${task.priority == '高'} ? 'bg-danger' : (${task.priority == '中'} ? 'bg-info text-dark' : 'bg-light text-dark border')">
                        中
                    </span>
                        </div>

                        <!-- 追加：2段目 メモ（詳細説明）と作成日時の表示領域 -->
                        <div class="mt-1 d-flex align-items-center text-muted" style="font-size: 0.85rem;">
                            <!-- メモが存在する場合のみ表示（完了時は打ち消し線） -->
                            <span th:if="${task.memo != null && !task.memo.isEmpty()}"
                                  th:text="${task.memo}"
                                  class="me-3 text-truncate"
                                  style="max-width: 300px;"
                                  th:classappend="${task.completed} ? 'text-decoration-line-through'">
                        ここにメモが表示されます
                    </span>

                            <!-- 作成日時の表示（秒をカットしてスッキリ表示） -->
                            <span th:if="${task.createdAt != null}">
                        <i class="bi bi-clock me-1"></i>作成: <span th:text="${#temporals.format(task.createdAt, 'yyyy/MM/dd HH:mm:ss')}">2026/01/01 00:00:00</span>
                    </span>
                        </div>
                    </div>
                </div>

                <!-- 右側の操作ボタン領域（変更なし） -->
                <div class="d-flex align-items-center">
                    <a th:href="@{/tasks/{id}/edit(id=${task.id}, page=${currentPage}, keyword=${currentKeyword}, filter=${currentStatus}, sort=${currentSortType})}"
                       class="btn btn-sm btn-outline-primary me-1">編集</a>

                    <form th:if="${!task.completed}"
                          th:action="@{/complete-task/{id}(id=${task.id}, page=${currentPage}, keyword=${currentKeyword}, filter=${currentStatus}, sort=${currentSortType})}" method="post" style="display:inline;" class="me-1">
                        <button type="submit" class="btn btn-sm btn-success">完了</button>
                    </form>

                    <form th:action="@{/delete-task/{id}(id=${task.id}, page=${currentPage}, keyword=${currentKeyword}, filter=${currentStatus}, sort=${currentSortType})}"
                          method="post" style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('本当に削除しますか？')">
                            完了（削除）</button>
                    </form>
                </div>
            </li>
        </ul>

        <!-- 4. JavaScript（全選択・ボタンの活性制御） -->
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const selectAll = document.getElementById('selectAll');
                const checkboxes = document.querySelectorAll('.task-checkbox');
                const deleteBtn = document.getElementById('bulkDeleteBtn');

                function toggleDeleteButton() {
                    const checkedCount = document.querySelectorAll('.task-checkbox:checked').length;
                    deleteBtn.disabled = checkedCount === 0; // 1つもチェックがなければボタンを無効化
                }

                selectAll.addEventListener('change', function () {
                    checkboxes.forEach(cb => cb.checked = selectAll.checked);
                    toggleDeleteButton();
                });

                checkboxes.forEach(cb => {
                    cb.addEventListener('change', function () {
                        const checkedCount = document.querySelectorAll('.task-checkbox:checked').length;
                        selectAll.checked = (checkedCount === checkboxes.length);
                        toggleDeleteButton();
                    });
                });
            });
        </script>
    </div>
</body>
</html>
