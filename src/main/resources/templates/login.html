<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
</head>
<body>
<h2>ログイン</h2>

<!-- エラーメッセージの表示（SecurityConfigの failureUrl と連動） -->
<div th:if="${param.error}" style="color: red;">
    ユーザー名またはパスワードが違います。
</div>
<!-- ログアウト完了メッセージの表示 -->
<div th:if="${param.logout}" style="color: green;">
    ログアウトしました。
</div>

<!-- 💡ポイント1: th:action は @{/login} 、 method は post -->
<form th:action="@{/login}" method="post">
    <div>
        <label>ユーザー名: </label>
        <!-- 💡ポイント2: name属性は必ず "username" -->
        <input type="text" name="username" required />
    </div>
    <div>
        <label>パスワード: </label>
        <!-- 💡ポイント3: name属性は必ず "password" -->
        <input type="password" name="password" required />
    </div>
    <button type="submit">ログイン</button>
</form>

<p><a th:href="@{/signup}">新規会員登録はこちら</a></p>
</body>
</html>
